name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage xml
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: tests   # só roda se os testes passarem
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          mkdir dist
          zip -r dist/campo-minado.zip src requirements.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: dist/campo-minado.zip

  notify:
    runs-on: ubuntu-latest
    needs: [tests, build]   # roda em paralelo após os dois concluírem
    steps:
      - uses: actions/checkout@v4
      - name: Send notification
        run: |
          echo "Pipeline executado!" > message.txt
          python scripts/notify.py
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
